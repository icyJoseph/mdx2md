# Runs the test suite and benchmarks on PRs. Jobs only run after you approve them
# (configure "Required reviewers" for the "pr-tests" environment in repo Settings → Environments).

name: PR Tests

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read
  pull-requests: write

jobs:
  test:
    name: Test suite
    runs-on: ubuntu-latest
    environment: pr-tests
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable
          components: rustfmt, clippy

      - name: Cache cargo registry
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      - name: Check format
        run: cargo fmt --all -- --check

      - name: Clippy
        run: cargo clippy --all-targets --all-features -- -D warnings

      - name: Run tests
        run: cargo test --workspace

  benchmark:
    name: Benchmarks
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable

      - name: Cache cargo registry
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-bench-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-bench-
            ${{ runner.os }}-cargo-

      - name: Run Rust benchmarks
        run: |
          cargo bench -p mdx2md-core --bench convert 2>&1 | tee bench-output.txt

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Run mdx-js baseline benchmarks
        working-directory: benchmarks/mdx-js
        run: |
          npm install --ignore-scripts
          node bench.mjs 2>&1 | tee ../../mdxjs-bench-output.txt

      - name: Parse benchmark results
        id: bench
        run: |
          {
            echo 'comment<<BENCH_EOF'
            echo '## 📊 Benchmark Results'
            echo ''
            echo '### mdx2md (Rust)'
            echo ''
            echo '| Benchmark | Low | Median | High |'
            echo '|-----------|-----|--------|------|'
            # Criterion output: <name>  time:   [<low> <median> <high>]
            # The name may be on the previous line if it wraps
            prev_name=""
            while IFS= read -r line; do
              if echo "$line" | grep -qE '^\S+\s*$'; then
                prev_name=$(echo "$line" | xargs)
                continue
              fi
              if echo "$line" | grep -qE 'time:\s+\['; then
                if echo "$line" | grep -qE '^\S+\s+time:'; then
                  name=$(echo "$line" | sed 's/\s*time:.*//' | xargs)
                else
                  name="$prev_name"
                fi
                times=$(echo "$line" | sed 's/.*\[\(.*\)\]/\1/')
                low=$(echo "$times" | awk '{print $1, $2}')
                median=$(echo "$times" | awk '{print $3, $4}')
                high=$(echo "$times" | awk '{print $5, $6}')
                echo "| \`${name}\` | ${low} | ${median} | ${high} |"
              fi
              prev_name=""
            done < bench-output.txt
            echo ''
            echo '### @mdx-js/mdx + remark (Node.js baseline)'
            echo ''
            echo '| Benchmark | Avg |'
            echo '|-----------|-----|'
            # mdx-js output: <label>: <N> ms (over <M> iters)
            grep -E '^[^ ].*: [0-9.]+ ms' mdxjs-bench-output.txt | while IFS= read -r line; do
              name=$(echo "$line" | sed 's/:.*//')
              ms=$(echo "$line" | sed 's/.*: \([0-9.]*\) ms.*/\1/')
              echo "| \`${name}\` | ${ms} ms |"
            done
            echo ''
            echo "<details><summary>Raw output</summary>"
            echo ''
            echo '**Rust (Criterion)**'
            echo '```'
            cat bench-output.txt
            echo '```'
            echo ''
            echo '**Node.js (@mdx-js/mdx)**'
            echo '```'
            cat mdxjs-bench-output.txt
            echo '```'
            echo ''
            echo '</details>'
            echo ''
            echo "_Commit: ${{ github.event.pull_request.head.sha }}_"
            echo 'BENCH_EOF'
          } >> "$GITHUB_OUTPUT"

      - name: Post benchmark comment
        uses: actions/github-script@v7
        env:
          BENCH_COMMENT: ${{ steps.bench.outputs.comment }}
        with:
          script: |
            const body = process.env.BENCH_COMMENT;
            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
            });
            const marker = '## 📊 Benchmark Results';
            const existing = comments.find(c => c.body.includes(marker));
            if (existing) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existing.id,
                body,
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body,
              });
            }
