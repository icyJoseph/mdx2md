# Runs the test suite and benchmarks on PRs. Jobs only run after you approve them
# (configure "Required reviewers" for the "pr-tests" environment in repo Settings → Environments).

name: PR Tests

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read
  pull-requests: write

jobs:
  test:
    name: Test suite
    runs-on: ubuntu-latest
    environment: pr-tests
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable
          components: rustfmt, clippy

      - name: Cache cargo registry
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      - name: Check format
        run: cargo fmt --all -- --check

      - name: Clippy
        run: cargo clippy --all-targets --all-features -- -D warnings

      - name: Run tests
        run: cargo test --workspace

  benchmark:
    name: Benchmarks
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable

      - name: Cache cargo registry
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-bench-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-bench-
            ${{ runner.os }}-cargo-

      - name: Run benchmarks
        run: |
          cargo bench -p mdx2md-core -- --output-format bencher 2>&1 | tee bench-output.txt

      - name: Parse benchmark results
        id: bench
        run: |
          {
            echo 'comment<<BENCH_EOF'
            echo '## 📊 Benchmark Results'
            echo ''
            echo '| Benchmark | Time |'
            echo '|-----------|------|'
            # Extract lines like: test <name> ... bench: <N> ns/iter (+/- <M>)
            grep 'bench:' bench-output.txt | while read -r line; do
              name=$(echo "$line" | sed 's/^test \(.*\) \.\.\. bench:.*/\1/' | xargs)
              ns=$(echo "$line" | sed 's/.*bench: *\([0-9,]*\) ns\/iter.*/\1/')
              variance=$(echo "$line" | sed 's/.*+\/- \([0-9,]*\)).*/\1/')
              # Convert ns to human-readable
              ns_clean=$(echo "$ns" | tr -d ',')
              if [ "$ns_clean" -ge 1000000 ]; then
                ms=$(awk "BEGIN {printf \"%.3f\", $ns_clean / 1000000}")
                time="${ms} ms"
              elif [ "$ns_clean" -ge 1000 ]; then
                us=$(awk "BEGIN {printf \"%.2f\", $ns_clean / 1000}")
                time="${us} µs"
              else
                time="${ns} ns"
              fi
              echo "| \`${name}\` | ${time} (± ${variance} ns) |"
            done
            echo ''
            echo "<details><summary>Raw output</summary>"
            echo ''
            echo '```'
            cat bench-output.txt
            echo '```'
            echo ''
            echo '</details>'
            echo ''
            echo "_Commit: ${{ github.event.pull_request.head.sha }}_"
            echo 'BENCH_EOF'
          } >> "$GITHUB_OUTPUT"

      - name: Post benchmark comment
        uses: actions/github-script@v7
        env:
          BENCH_COMMENT: ${{ steps.bench.outputs.comment }}
        with:
          script: |
            const body = process.env.BENCH_COMMENT;
            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
            });
            const marker = '## 📊 Benchmark Results';
            const existing = comments.find(c => c.body.includes(marker));
            if (existing) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existing.id,
                body,
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body,
              });
            }
